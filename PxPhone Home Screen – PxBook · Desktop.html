<body>
  <div id="__bundler_placeholder">Loading PxBook Desktop...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

}}<\u002Fdiv>\n                <div dir=\"{{tr.out.dir}}\" style=\"font-size: 32px; font-weight: 700; line-height: 1.4; font-family: 'Noto Serif Tibetan','Noto Naskh Arabic','Manrope',system-ui,sans-serif\">{{tr.out.text}}<\u002Fdiv>\n                <div style=\"font-size: 14px; font-weight: 700; opacity: .9\">{{tr.out.roman}}<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"w-sub\">Demo phrasebook: Hello, Thank you, Goodbye, Good morning, Welcome.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 15 PXMAPS -->\n          <sc-if value=\"{{w.is.maps}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex: 1; position: relative; background: #E6EEF2; overflow: hidden\">\n              <svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 640 440\" width=\"100%\" height=\"100%\" sc-camel-preserve-aspect-ratio=\"xMidYMid slice\" style=\"position: absolute; inset: 0\">\n                <rect x=\"380\" y=\"250\" width=\"180\" height=\"120\" rx=\"20\" fill=\"#BFE3C4\"><\u002Frect>\n                <rect x=\"40\" y=\"40\" width=\"140\" height=\"90\" rx=\"18\" fill=\"#BFE3C4\"><\u002Frect>\n                <path d=\"M-10 230 C 120 180, 220 300, 340 250 S 540 170, 660 220\" stroke=\"#A9D3F2\" stroke-width=\"30\" fill=\"none\"><\u002Fpath>\n                <path d=\"M0 150 H640 M0 360 H640 M120 0 V440 M470 0 V440 M260 0 L330 440\" stroke=\"#FFFFFF\" stroke-width=\"12\" fill=\"none\"><\u002Fpath>\n                <path d=\"{{map.route}}\" stroke=\"#2B6BE6\" stroke-width=\"7\" stroke-dasharray=\"2 12\" stroke-linecap=\"round\" fill=\"none\" opacity=\"{{map.routeOp}}\"><\u002Fpath>\n              <\u002Fsvg>\n              <sc-for list=\"{{map.pins}}\" as=\"p\" hint-placeholder-count=\"5\">\n                <button class=\"plain\" sc-camel-on-click=\"{{p.pick}}\" aria-label=\"{{p.name}}\" style=\"{{p.style}}\">\n                  <span style=\"width: 34px; height: 34px; border-radius: 17px 17px 17px 4px; transform: rotate(-45deg); background: {{p.color}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(0,0,0,.25)\"><span style=\"width: 11px; height: 11px; border-radius: 50%; background: #ffffff\"><\u002Fspan><\u002Fspan>\n                  <span style=\"font-size: 11px; font-weight: 800; color: #0E1726; background: rgba(255,255,255,.9); padding: 2px 6px; border-radius: 6px; margin-top: 4px; white-space: nowrap\">{{p.name}}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <div class=\"w-card\" style=\"position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 12px; min-width: 260px; box-shadow: 0 10px 30px rgba(0,0,0,.2)\">\n                <div style=\"flex: 1\"><div style=\"font-weight: 800; font-size: 15px\">{{map.sel.name}}<\u002Fdiv><div class=\"w-sub\">{{map.sel.info}}<\u002Fdiv><\u002Fdiv>\n                <button class=\"w-btn\" sc-camel-on-click=\"{{map.toggleRoute}}\" style=\"background: #2B6BE6; color: #ffffff\">{{map.routeBtn}}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 16 PXWEATHER -->\n          <sc-if value=\"{{w.is.weather}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"scr\" style=\"flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n              <div style=\"display: flex; gap: 6px; flex-wrap: wrap\">\n                <sc-for list=\"{{wx.cities}}\" as=\"c\" hint-placeholder-count=\"4\"><button class=\"w-chip {{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\">{{c.name}}<\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"border-radius: 20px; padding: 22px; color: #ffffff; background: {{wx.g}}; transition: background .5s\">\n                <div style=\"font-size: 18px; font-weight: 800\">{{wx.city}}<\u002Fdiv>\n                <div style=\"font-size: 76px; font-weight: 800; line-height: 1; letter-spacing: -3px\">{{wx.temp}}<\u002Fdiv>\n                <div style=\"font-size: 16px; font-weight: 700\">{{wx.cond}} · H {{wx.hi}} L {{wx.lo}}<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"w-card\" style=\"display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); text-align: center\">\n                <sc-for list=\"{{wx.days}}\" as=\"d\" hint-placeholder-count=\"5\"><div><div class=\"w-sub\" style=\"font-weight: 700\">{{d.day}}<\u002Fdiv><div style=\"font-size: 18px; font-weight: 800\">{{d.t}}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n              <\u002Fdiv>\n              <div class=\"w-sub\">Demo forecast, not live weather.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 17 PXCALCULATOR -->\n          <sc-if value=\"{{w.is.calc}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"zoom: {{w.k}}; flex: 1; background: #16191F; padding: 14px; display: flex; flex-direction: column; gap: 10px; color: #ffffff\">\n              <div style=\"flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; min-height: 60px\">\n                <div style=\"font-size: 13px; opacity: .55; font-weight: 700\">{{calc.hist}}<\u002Fdiv>\n                <div style=\"font-size: 46px; font-weight: 600; letter-spacing: -1px; white-space: nowrap; overflow: hidden; max-width: 100%\">{{calc.disp}}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px\">\n                <sc-for list=\"{{calc.keys}}\" as=\"k\" hint-placeholder-count=\"19\"><button class=\"calc-k\" sc-camel-on-click=\"{{k.press}}\" aria-label=\"{{k.aria}}\" style=\"{{k.style}}\">{{k.label}}<\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 18 PXTERMINAL -->\n          <sc-if value=\"{{w.is.terminal}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"term\" style=\"flex: 1; background: #0D1016; color: #D7E3F4; display: flex; flex-direction: column\">\n              <div class=\"scr\" style=\"flex: 1; display: flex; flex-direction: column-reverse; padding: 10px 12px\">\n                <div>\n                  <sc-for list=\"{{term.lines}}\" as=\"l\" hint-placeholder-count=\"3\"><div style=\"white-space: pre-wrap; color: {{l.c}}\">{{l.t}}<\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <label style=\"display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid rgba(255,255,255,.08)\">\n                <span style=\"color: #7FD3F7; white-space: nowrap\">{{term.prompt}} ~ %<\u002Fspan>\n                <input aria-label=\"Terminal command\" value=\"{{term.input}}\" sc-camel-on-change=\"{{term.onInput}}\" sc-camel-on-key-down=\"{{term.onKey}}\" spellcheck=\"false\" autocomplete=\"off\" style=\"flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font: inherit\">\n              <\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 19 PXPAINT -->\n          <sc-if value=\"{{w.is.paint}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex: 1; display: flex; flex-direction: column\">\n              <div style=\"display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap\">\n                <sc-for list=\"{{paint.colors}}\" as=\"c\" hint-placeholder-count=\"7\"><button class=\"plain\" sc-camel-on-click=\"{{c.pick}}\" aria-label=\"Color {{c.c}}\" aria-pressed=\"{{c.on}}\" style=\"{{c.style}}\"><\u002Fbutton><\u002Fsc-for>\n                <span style=\"width: 1px; height: 22px; background: var(--line)\"><\u002Fspan>\n                <sc-for list=\"{{paint.sizes}}\" as=\"z\" hint-placeholder-count=\"3\"><button class=\"w-chip {{z.cls}}\" sc-camel-on-click=\"{{z.pick}}\">{{z.label}}<\u002Fbutton><\u002Fsc-for>\n                <span style=\"flex: 1\"><\u002Fspan>\n                <button class=\"w-btn2\" sc-camel-on-click=\"{{paint.undo}}\">Undo<\u002Fbutton>\n                <button class=\"w-btn2\" sc-camel-on-click=\"{{paint.clear}}\">Clear<\u002Fbutton>\n              <\u002Fdiv>\n              <div sc-camel-on-pointer-down=\"{{paint.down}}\" sc-camel-on-pointer-move=\"{{paint.move}}\" sc-camel-on-pointer-up=\"{{paint.up}}\" style=\"flex: 1; position: relative; background: #ffffff; touch-action: none; cursor: crosshair; overflow: hidden\">\n                <sc-for list=\"{{paint.strokes}}\" as=\"s\" hint-placeholder-count=\"0\">\n                  <svg aria-hidden=\"true\" width=\"100%\" height=\"100%\" style=\"position: absolute; inset: 0; pointer-events: none\"><path d=\"{{s.d}}\" stroke=\"{{s.c}}\" stroke-width=\"{{s.w}}\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fsc-for>\n                <svg aria-hidden=\"true\" width=\"100%\" height=\"100%\" style=\"position: absolute; inset: 0; pointer-events: none\"><path d=\"{{paint.curD}}\" stroke=\"{{paint.color}}\" stroke-width=\"{{paint.size}}\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <sc-if value=\"{{paint.blank}}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9AA4B2; font-weight: 700; pointer-events: none\">Draw here with your mouse, finger or pencil<\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 20 PXCLOCK -->\n          <sc-if value=\"{{w.is.clock}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"scr\" style=\"flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n              <div class=\"w-lbl\">World clock<\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px\">\n                <sc-for list=\"{{clk.zones}}\" as=\"z\" hint-placeholder-count=\"6\">\n                  <div class=\"w-card\"><div class=\"w-sub\" style=\"font-weight: 700\">{{z.city}}<\u002Fdiv><div style=\"font-size: 26px; font-weight: 800\">{{z.time}}<\u002Fdiv><div class=\"w-sub\">{{z.day}}<\u002Fdiv><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div class=\"w-lbl\">Stopwatch<\u002Fdiv>\n              <div class=\"w-card\" style=\"display: flex; align-items: center; gap: 12px\">\n                <div style=\"flex: 1; font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums\">{{clk.sw}}<\u002Fdiv>\n                <button class=\"w-btn\" sc-camel-on-click=\"{{clk.toggle}}\">{{clk.btn}}<\u002Fbutton>\n                <button class=\"w-btn2\" sc-camel-on-click=\"{{clk.reset}}\">Reset<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 21 PXTODO -->\n          <sc-if value=\"{{w.is.todo}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex: 1; display: flex; flex-direction: column; padding: 14px; gap: 10px\">\n              <div style=\"display: flex; gap: 8px\">\n                <input class=\"w-inp\" style=\"flex: 1\" aria-label=\"New task\" placeholder=\"Add a task\" value=\"{{todo.input}}\" sc-camel-on-change=\"{{todo.onInput}}\" sc-camel-on-key-down=\"{{todo.onKey}}\">\n                <button class=\"w-btn\" sc-camel-on-click=\"{{todo.add}}\">Add<\u002Fbutton>\n              <\u002Fdiv>\n              <div class=\"scr\" style=\"flex: 1; display: flex; flex-direction: column; gap: 6px\">\n                <sc-for list=\"{{todo.list}}\" as=\"t\" hint-placeholder-count=\"3\">\n                  <div class=\"w-card\" style=\"display: flex; align-items: center; gap: 10px; padding: 9px 12px\">\n                    <button class=\"plain\" role=\"checkbox\" aria-checked=\"{{t.aria}}\" aria-label=\"{{t.text}}\" sc-camel-on-click=\"{{t.toggle}}\" style=\"{{t.box}}\">{{t.check}}<\u002Fbutton>\n                    <span style=\"{{t.textStyle}}\">{{t.text}}<\u002Fspan>\n                    <button class=\"plain\" sc-camel-on-click=\"{{t.remove}}\" aria-label=\"Delete task\" style=\"opacity: .55; padding: 4px\">✕<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; align-items: center\"><span class=\"w-sub\">{{todo.left}}<\u002Fspan><button class=\"w-btn2\" sc-camel-on-click=\"{{todo.clearDone}}\">Clear completed<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 22 PXBROWSER -->\n          <sc-if value=\"{{w.is.browser}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex: 1; display: flex; flex-direction: column; min-width: 0\">\n              <div style=\"display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); align-items: center\">\n                <button class=\"w-btn2\" sc-camel-on-click=\"{{web.back}}\" aria-label=\"Back\">‹<\u002Fbutton>\n                <button class=\"w-btn2\" sc-camel-on-click=\"{{web.home}}\" aria-label=\"Home\">⌂<\u002Fbutton>\n                <input class=\"w-inp\" style=\"flex: 1; text-align: center\" aria-label=\"Address or search\" placeholder=\"Search Google or type a website\" value=\"{{web.input}}\" sc-camel-on-change=\"{{web.onInput}}\" sc-camel-on-key-down=\"{{web.onKey}}\">\n                <button class=\"w-btn\" sc-camel-on-click=\"{{web.go}}\">Go<\u002Fbutton>\n              <\u002Fdiv>\n              <div class=\"scr\" style=\"flex: 1; padding: 28px 34px; display: flex; flex-direction: column; gap: 12px\">\n                <sc-if value=\"{{web.isHome}}\" hint-placeholder-val=\"{{ false }}\">\n                  <div class=\"w-card\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 18px\">\n                    <div style=\"font-size: 20px; font-weight: 800\">Search Google<\u002Fdiv>\n                    <div style=\"display: flex; gap: 8px\">\n                      <input class=\"w-inp\" style=\"flex: 1; height: 42px; font-size: 15px\" aria-label=\"Search Google\" placeholder=\"Type anything and press Enter\" value=\"{{web.gq}}\" sc-camel-on-change=\"{{web.onGq}}\" sc-camel-on-key-down=\"{{web.onGqKey}}\">\n                      <button class=\"w-btn\" sc-camel-on-click=\"{{web.gSearch}}\" style=\"height: 42px\">Search<\u002Fbutton>\n                    <\u002Fdiv>\n                    <div class=\"w-sub\">Results open in a real browser tab. <a href=\"{{web.gHref}}\" target=\"_blank\" rel=\"noopener noreferrer\">Open Google<\u002Fa><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"font-size: 30px; font-weight: 800; letter-spacing: -.5px; word-break: break-word\">{{web.page.title}}<\u002Fdiv>\n                <sc-for list=\"{{web.page.paras}}\" as=\"p\" hint-placeholder-count=\"2\"><div style=\"font-size: 15px; line-height: 1.65\">{{p}}<\u002Fdiv><\u002Fsc-for>\n                <sc-for list=\"{{web.page.ext}}\" as=\"x\" hint-placeholder-count=\"0\"><a href=\"{{x.href}}\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"w-btn\" style=\"align-self: flex-start; text-decoration: none\">{{x.label}} ↗<\u002Fa><\u002Fsc-for>\n                <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 6px\">\n                  <sc-for list=\"{{web.page.links}}\" as=\"l\" hint-placeholder-count=\"3\">\n                    <button class=\"w-card plain\" sc-camel-on-click=\"{{l.go}}\" style=\"display: flex; flex-direction: column; gap: 4px; padding: 14px; background: var(--card)\"><span style=\"font-weight: 800; color: #1F9BD1\">{{l.label}}<\u002Fspan><span class=\"w-sub\">{{l.url}}<\u002Fspan><\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 23 PXMAIL -->\n          <sc-if value=\"{{w.is.mail}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"w-side\" style=\"width: 150px\">\n              <button class=\"w-btn\" sc-camel-on-click=\"{{mail.compose}}\" style=\"margin-bottom: 8px\">Compose<\u002Fbutton>\n              <sc-for list=\"{{mail.boxes}}\" as=\"b\" hint-placeholder-count=\"2\"><button class=\"w-item {{b.cls}}\" sc-camel-on-click=\"{{b.pick}}\">{{b.name}}<span style=\"margin-left: auto; opacity: .7\">{{b.count}}<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n            <div class=\"scr\" style=\"width: 230px; flex: none; border-right: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 4px\">\n              <sc-for list=\"{{mail.list}}\" as=\"m\" hint-placeholder-count=\"3\">\n                <button class=\"w-item {{m.cls}}\" sc-camel-on-click=\"{{m.pick}}\" style=\"flex-direction: column; align-items: flex-start; gap: 2px; padding: 9px 10px\">\n                  <span style=\"font-weight: 800\">{{m.who}}<\u002Fspan><span style=\"font-weight: 700\">{{m.subject}}<\u002Fspan><span style=\"font-size: 11px; opacity: .7; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{m.body}}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <sc-if value=\"{{mail.empty}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"w-sub\" style=\"padding: 16px\">No messages.<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n            <div class=\"scr\" style=\"flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0\">\n              <sc-if value=\"{{mail.composing}}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"w-h\">New message<\u002Fdiv>\n                <input class=\"w-inp\" aria-label=\"To\" placeholder=\"To\" value=\"{{mail.to}}\" sc-camel-on-change=\"{{mail.onTo}}\">\n                <input class=\"w-inp\" aria-label=\"Subject\" placeholder=\"Subject\" value=\"{{mail.subj}}\" sc-camel-on-change=\"{{mail.onSubj}}\">\n                <textarea class=\"w-inp\" aria-label=\"Message\" placeholder=\"Write your message…\" value=\"{{mail.body}}\" sc-camel-on-change=\"{{mail.onBody}}\" style=\"height: 160px; padding: 10px; resize: none\"><\u002Ftextarea>\n                <div style=\"display: flex; gap: 8px\"><button class=\"w-btn\" sc-camel-on-click=\"{{mail.send}}\">Send<\u002Fbutton><button class=\"w-btn2\" sc-camel-on-click=\"{{mail.cancel}}\">Cancel<\u002Fbutton><\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{mail.reading}}\" hint-placeholder-val=\"{{ true }}\">\n                <div class=\"w-h\">{{mail.cur.subject}}<\u002Fdiv>\n                <div class=\"w-sub\">{{mail.cur.whoLine}}<\u002Fdiv>\n                <div style=\"font-size: 15px; line-height: 1.65; white-space: pre-line\">{{mail.cur.body}}<\u002Fdiv>\n                <div><button class=\"w-btn2\" sc-camel-on-click=\"{{mail.reply}}\">Reply<\u002Fbutton><\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 24 PXCONTACTS -->\n          <sc-if value=\"{{w.is.contacts}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"w-side scr\" style=\"width: 200px\">\n              <button class=\"w-btn\" sc-camel-on-click=\"{{con.addMode}}\" style=\"margin-bottom: 8px\">+ New contact<\u002Fbutton>\n              <sc-for list=\"{{con.list}}\" as=\"c\" hint-placeholder-count=\"4\"><button class=\"w-item {{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\">{{c.name}}<\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n            <div class=\"scr\" style=\"flex: 1; padding: 22px; display: flex; flex-direction: column; gap: 10px; align-items: center\">\n              <sc-if value=\"{{con.adding}}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"w-h\">New contact<\u002Fdiv>\n                <input class=\"w-inp\" style=\"width: 260px\" aria-label=\"Name\" placeholder=\"Name\" value=\"{{con.name}}\" sc-camel-on-change=\"{{con.onName}}\">\n                <input class=\"w-inp\" style=\"width: 260px\" aria-label=\"Email\" placeholder=\"Email\" value=\"{{con.email}}\" sc-camel-on-change=\"{{con.onEmail}}\">\n                <button class=\"w-btn\" sc-camel-on-click=\"{{con.save}}\">Save contact<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{con.viewing}}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"width: 96px; height: 96px; border-radius: 48px; background: {{con.cur.color}}; color: #ffffff; font-size: 36px; font-weight: 800; display: flex; align-items: center; justify-content: center\">{{con.cur.initials}}<\u002Fspan>\n                <div style=\"font-size: 22px; font-weight: 800\">{{con.cur.name}}<\u002Fdiv>\n                <div class=\"w-sub\">{{con.cur.note}}<\u002Fdiv>\n                <div class=\"w-card\" style=\"width: 280px\"><div class=\"w-lbl\">Email<\u002Fdiv><div style=\"font-weight: 700; color: #3478F6\">{{con.cur.email}}<\u002Fdiv><\u002Fdiv>\n                <div style=\"display: flex; gap: 8px\"><button class=\"w-btn\" sc-camel-on-click=\"{{con.mail}}\">Email<\u002Fbutton><button class=\"w-btn2\" sc-camel-on-click=\"{{open.chat}}\">Message<\u002Fbutton><button class=\"w-btn2\" sc-camel-on-click=\"{{con.del}}\" style=\"color: #E5543F\">Delete<\u002Fbutton><\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 25 PXFIT -->\n          <sc-if value=\"{{w.is.fit}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"scr\" style=\"zoom: {{w.k}}; flex: 1; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 14px\">\n              <svg aria-hidden=\"true\" width=\"180\" height=\"180\" sc-camel-view-box=\"0 0 180 180\">\n                <circle cx=\"90\" cy=\"90\" r=\"76\" fill=\"none\" stroke=\"rgba(242,176,33,0.2)\" stroke-width=\"16\"><\u002Fcircle>\n                <circle cx=\"90\" cy=\"90\" r=\"76\" fill=\"none\" stroke=\"#F2B021\" stroke-width=\"16\" stroke-linecap=\"round\" stroke-dasharray=\"{{fit.dash1}}\" transform=\"rotate(-90 90 90)\" style=\"transition: stroke-dasharray .5s\"><\u002Fcircle>\n                <circle cx=\"90\" cy=\"90\" r=\"54\" fill=\"none\" stroke=\"rgba(47,184,110,0.2)\" stroke-width=\"16\"><\u002Fcircle>\n                <circle cx=\"90\" cy=\"90\" r=\"54\" fill=\"none\" stroke=\"#2FB86E\" stroke-width=\"16\" stroke-linecap=\"round\" stroke-dasharray=\"{{fit.dash2}}\" transform=\"rotate(-90 90 90)\" style=\"transition: stroke-dasharray .5s\"><\u002Fcircle>\n              <\u002Fsvg>\n              <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%\">\n                <div class=\"w-card\"><div class=\"w-lbl\" style=\"color: #C98A0A\">Steps<\u002Fdiv><div style=\"font-size: 24px; font-weight: 800\">{{fit.steps}}<\u002Fdiv><div class=\"w-sub\">Goal 10,000<\u002Fdiv><\u002Fdiv>\n                <div class=\"w-card\"><div class=\"w-lbl\" style=\"color: #1F8F55\">Exercise<\u002Fdiv><div style=\"font-size: 24px; font-weight: 800\">{{fit.mins}} min<\u002Fdiv><div class=\"w-sub\">Goal 30 min<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 8px; flex-wrap: wrap; justify-content: center\">\n                <button class=\"w-btn\" sc-camel-on-click=\"{{fit.addSteps}}\" style=\"background: #F2B021\">+1,000 steps<\u002Fbutton>\n                <button class=\"w-btn\" sc-camel-on-click=\"{{fit.addMins}}\" style=\"background: #2FB86E; color: #ffffff\">+10 min workout<\u002Fbutton>\n                <button class=\"w-btn2\" sc-camel-on-click=\"{{fit.reset}}\">Reset day<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"font-weight: 800\">{{fit.msg}}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 26 PXPIANO -->\n          <sc-if value=\"{{w.is.piano}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex: 1; display: flex; flex-direction: column; padding: 14px; gap: 10px; background: #1B1E26; color: #ffffff\">\n              <div style=\"display: flex; justify-content: space-between; align-items: center\"><span style=\"font-weight: 800\">PxPiano · tap the keys<\u002Fspan><span style=\"font-size: 12px; opacity: .7\">Volume follows PxSettings<\u002Fspan><\u002Fdiv>\n              <div style=\"flex: 1; position: relative; display: flex; border-radius: 10px; overflow: hidden\">\n                <sc-for list=\"{{piano.whites}}\" as=\"k\" hint-placeholder-count=\"15\"><button class=\"wkey {{k.cls}}\" sc-camel-on-pointer-down=\"{{k.play}}\" aria-label=\"{{k.n}}\">{{k.n}}<\u002Fbutton><\u002Fsc-for>\n                <sc-for list=\"{{piano.blacks}}\" as=\"k\" hint-placeholder-count=\"10\"><button class=\"bkey {{k.cls}}\" sc-camel-on-pointer-down=\"{{k.play}}\" aria-label=\"{{k.n}}\" style=\"left: {{k.left}}\"><\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 27 PXMEMORY -->\n          <sc-if value=\"{{w.is.memory}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"scr\" style=\"zoom: {{w.k}}; flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: center\">\n              <div style=\"display: flex; gap: 16px; align-items: center\"><span class=\"w-h\">PxMemory<\u002Fspan><span class=\"w-sub\">Moves {{mem.moves}}<\u002Fspan><button class=\"w-btn2\" sc-camel-on-click=\"{{mem.reset}}\">New game<\u002Fbutton><\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: repeat(4, 86px); grid-auto-rows: 86px; gap: 10px\">\n                <sc-for list=\"{{mem.cards}}\" as=\"c\" hint-placeholder-count=\"12\"><button class=\"mcard\" sc-camel-on-click=\"{{c.flip}}\" aria-label=\"{{c.aria}}\" style=\"{{c.style}}\">{{c.label}}<\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-weight: 800; color: var(--acc)\">{{mem.msg}}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 28 PXCONVERT -->\n          <sc-if value=\"{{w.is.convert}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"scr\" style=\"flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; gap: 6px\">\n                <sc-for list=\"{{cv.cats}}\" as=\"c\" hint-placeholder-count=\"3\"><button class=\"w-chip {{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\">{{c.name}}<\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 10px\">\n                <label style=\"flex: 1; display: flex; flex-direction: column; gap: 4px\"><span class=\"w-lbl\">{{cv.from}}<\u002Fspan><input class=\"w-inp\" inputmode=\"decimal\" value=\"{{cv.val}}\" sc-camel-on-change=\"{{cv.onVal}}\" style=\"height: 44px; font-size: 20px; font-weight: 800\"><\u002Flabel>\n                <button class=\"w-btn2\" sc-camel-on-click=\"{{cv.swap}}\" aria-label=\"Swap units\" style=\"margin-top: 18px\">⇄<\u002Fbutton>\n                <div style=\"flex: 1; display: flex; flex-direction: column; gap: 4px\"><span class=\"w-lbl\">{{cv.to}}<\u002Fspan><div class=\"w-card\" style=\"height: 44px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; font-size: 20px; font-weight: 800; color: var(--acc)\">{{cv.out}}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 29 PXACTIVITY -->\n          <sc-if value=\"{{w.is.activity}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"scr\" style=\"flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n              <div class=\"w-card\">\n                <div style=\"display: flex; justify-content: space-between\"><span class=\"w-lbl\">CPU<\u002Fspan><span style=\"font-weight: 800\">{{act.cpu}}<\u002Fspan><\u002Fdiv>\n                <svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 300 90\" width=\"100%\" height=\"90\" sc-camel-preserve-aspect-ratio=\"none\"><polyline points=\"{{act.pts}}\" fill=\"none\" stroke=\"#2A9D5C\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"w-card\">\n                <div style=\"display: flex; justify-content: space-between; margin-bottom: 6px\"><span class=\"w-lbl\">Memory<\u002Fspan><span style=\"font-weight: 800\">{{act.mem}}<\u002Fspan><\u002Fdiv>\n                <div style=\"height: 10px; border-radius: 5px; background: var(--line); overflow: hidden\"><div style=\"height: 100%; width: {{act.memPct}}; background: #2B6BE6; transition: width .4s\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"w-lbl\">Open apps<\u002Fdiv>\n              <sc-for list=\"{{act.procs}}\" as=\"p\" hint-placeholder-count=\"2\">\n                <div class=\"w-card\" style=\"display: flex; align-items: center; gap: 10px; padding: 8px 12px\">\n                  <span style=\"width: 10px; height: 10px; border-radius: 3px; background: {{p.c}}\"><\u002Fspan>\n                  <span style=\"flex: 1; font-weight: 700\">{{p.name}}<\u002Fspan>\n                  <span class=\"w-sub\">{{p.cpu}}<\u002Fspan>\n                  <button class=\"w-btn2\" sc-camel-on-click=\"{{p.quit}}\" style=\"height: 28px\">Quit<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 31 PXKEYS -->\n          <sc-if value=\"{{w.is.keys}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex: 1; display: flex; flex-direction: column; min-width: 0\">\n              <div style=\"padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line)\">\n                <div style=\"display: flex; gap: 8px; align-items: center\">\n                  <input class=\"w-inp\" style=\"flex: 1\" aria-label=\"Search shortcuts\" placeholder=\"Search keyboard shortcuts\" value=\"{{kb.q}}\" sc-camel-on-change=\"{{kb.onQ}}\">\n                  <span class=\"w-sub\" style=\"font-weight: 700\">{{kb.count}} shown<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display: flex; gap: 6px; flex-wrap: wrap\">\n                  <sc-for list=\"{{kb.cats}}\" as=\"c\" hint-placeholder-count=\"7\"><button class=\"w-chip {{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\">{{c.name}}<\u002Fbutton><\u002Fsc-for>\n                <\u002Fdiv>\n                <div class=\"w-sub\">Hold <b>⌘ Command<\u002Fb> or <b>⌃ Control<\u002Fb> with each key. If Safari takes a ⌘ shortcut, use ⌃ instead. Tap any row to try it. Last used: <b>{{kb.last}}<\u002Fb><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"scr\" style=\"flex: 1; padding: 8px 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 14px; align-content: start\">\n                <sc-for list=\"{{kb.list}}\" as=\"k\" hint-placeholder-count=\"12\">\n                  <button class=\"w-item {{k.cls}}\" sc-camel-on-click=\"{{k.run}}\" style=\"justify-content: space-between; padding: 6px 8px\">\n                    <span style=\"font-weight: 600; text-align: left\">{{k.label}}<\u002Fspan>\n                    <span class=\"kcap\">{{k.keys}}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- 32 PXCAMERA -->\n          <sc-if value=\"{{w.is.camera}}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex: 1; display: flex; flex-direction: column; background: #0B0D12; color: #ffffff; min-width: 0\">\n              <div style=\"flex: 1; margin: 12px 12px 0; border-radius: 14px; overflow: hidden; position: relative; background: {{cam.g}}; filter: {{cam.f}}\">\n                <svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 400 260\" width=\"100%\" height=\"100%\" sc-camel-preserve-aspect-ratio=\"xMidYMid slice\" style=\"position: absolute; inset: 0\"><circle cx=\"300\" cy=\"70\" r=\"28\" fill=\"rgba(255,255,255,0.75)\"><\u002Fcircle><path d=\"M0 200 L70 130 L120 165 L200 90 L270 160 L330 120 L400 170 L400 260 L0 260Z\" fill=\"rgba(255,255,255,0.4)\"><\u002Fpath><path d=\"M0 225 L90 190 L170 215 L250 185 L340 210 L400 200 L400 260 L0 260Z\" fill=\"rgba(30,60,90,0.3)\"><\u002Fpath><path d=\"M180 232c0-16 7-27 16-27s16 11 16 27c0 13-7 19-16 19s-16-6-16-19z\" fill=\"#141824\"><\u002Fpath><path d=\"M188 234c0-9 4-15 8-15s8 6 8 15-4 13-8 13-8-4-8-13z\" fill=\"#ffffff\"><\u002Fpath><path d=\"M193 214l3 3 3-3z\" fill=\"#F2A23A\"><\u002Fpath><\u002Fsvg>\n                <div aria-hidden=\"true\" style=\"position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.18) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.18) 1px, transparent 1px); background-size: 33.33% 33.33%\"><\u002Fdiv>\n                <sc-if value=\"{{cam.flash}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"{{cam.flashCls}}\" style=\"position: absolute; inset: 0; background: #ffffff; opacity: 0\"><\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n              <div class=\"scr\" style=\"display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto\">\n                <sc-for list=\"{{cam.filters}}\" as=\"f\" hint-placeholder-count=\"6\"><button class=\"w-chip {{f.cls}}\" sc-camel-on-click=\"{{f.pick}}\">{{f.name}}<\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 0 20px 14px\">\n                <button class=\"w-btn2\" sc-camel-on-click=\"{{open.photos}}\">PxPhotos ({{cam.count}})<\u002Fbutton>\n                <button class=\"pla
