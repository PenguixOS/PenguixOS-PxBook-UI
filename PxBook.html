<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080F;touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#safe{position:fixed;left:env(safe-area-inset-left);right:env(safe-area-inset-right);top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);pointer-events:none}
#stage{position:fixed;left:0;top:0;width:1180px;height:820px;transform-origin:0 0}

body{margin:0;background:#05080F}
a{color:#7FD3F7}a:hover{color:#ffffff}
button,input,textarea{font-family:inherit}
.nocur,.nocur *{cursor:none !important}
.plain{all:unset;cursor:pointer;box-sizing:border-box}
.plain:focus-visible,.w-item:focus-visible,.w-btn:focus-visible,.w-btn2:focus-visible,.w-chip:focus-visible,.dk:focus-visible{outline:2px solid #7FD3F7;outline-offset:2px}
.glass{background:rgba(255,255,255,0.14);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid rgba(255,255,255,0.22);box-shadow:inset 0 1px 0 rgba(255,255,255,0.22)}
.dglass{background:rgba(22,26,38,0.72);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border:1px solid rgba(255,255,255,0.12);box-shadow:0 18px 50px rgba(0,0,0,0.45)}
.ico{display:inline-flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,0.45),inset 0 -8px 14px rgba(0,0,0,0.14),0 6px 14px rgba(0,0,0,0.28)}
.ico::after{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(rgba(255,255,255,0.3),rgba(255,255,255,0));pointer-events:none}
.blob1{animation:drift1 18s ease-in-out infinite}.blob2{animation:drift2 21s ease-in-out infinite}.blob3{animation:drift3 24s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,80px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-140px,-60px)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(100px,-90px)}}
.win{position:absolute;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--bg);color:var(--fg);font-size:13px;box-shadow:0 24px 60px rgba(0,0,0,0.45),0 0 0 1px rgba(0,0,0,0.3),inset 0 0 0 1px rgba(255,255,255,0.06);animation:winin .22s cubic-bezier(.2,.9,.3,1.15)}
@keyframes winin{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.tbar{height:38px;flex:none;display:flex;align-items:center;padding:0 10px;gap:8px;background:var(--tbar);border-bottom:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.win.dim .tbar{opacity:.75}
.tl{all:unset;cursor:pointer;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.tl span{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.18)}
.tl:hover span{filter:brightness(.85)}
.wbody{flex:1;min-height:0;position:relative;overflow:hidden;display:flex}

.ai-act{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:9px;background:rgba(142,92,245,0.14);color:var(--fg);margin:6px 6px 0 0;font-family:'JetBrains Mono',ui-monospace,monospace}
.ai-dots span{display:inline-block;width:6px;height:6px;border-radius:3px;background:currentColor;margin-right:4px;animation:aiDot 1s ease-in-out infinite}.ai-dots span:nth-child(2){animation-delay:.15s}.ai-dots span:nth-child(3){animation-delay:.3s}
@keyframes aiDot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.wt-chip{all:unset;cursor:pointer;font-size:12px;font-weight:700;padding:5px 10px;border-radius:14px;background:rgba(142,92,245,0.12);color:var(--fg);white-space:nowrap}
.wt-chip:hover{background:rgba(142,92,245,0.24)}.wt-chip.on{background:#8E5CF5;color:#ffffff}
.px-panic{position:absolute;inset:0;z-index:1998;background:linear-gradient(160deg,#0B2A55,#123E7A 55%,#0A2246);color:#ffffff;display:flex;align-items:center;justify-content:center;font-family:Manrope,system-ui,sans-serif;cursor:default}
.px-panic-in{width:min(760px,86%);display:flex;flex-direction:column;gap:18px}
.px-panic-peng{animation:panicWobble 2.4s ease-in-out infinite}@keyframes panicWobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.kcap{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:12px;background:var(--side);padding:3px 7px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}


.rvroot{margin:0;background:#05070D}
.rvroot a{color:#7FD3F7}
.rvroot a:hover{color:#ffffff}
.rvroot button,.rvroot input,.rvroot textarea{font-family:inherit}
.rvroot .plain{all:unset;cursor:pointer;box-sizing:border-box}
.rvroot .plain:focus-visible,.rvroot .rb:focus-visible,.rvroot .rb2:focus-visible,.rvroot .nav:focus-visible,.rvroot .qa:focus-visible{outline:2px solid #7FD3F7;outline-offset:2px}
.rvroot .rb{all:unset;box-sizing:border-box;cursor:pointer;min-height:46px;padding:0 22px;border-radius:12px;background:#7FD3F7;color:#0B1A2E;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .12s,filter .12s}
.rvroot .rb:hover{filter:brightness(1.08)}
.rvroot .rb2{all:unset;box-sizing:border-box;cursor:pointer;min-height:46px;padding:0 18px;border-radius:12px;background:rgba(255,255,255,0.1);color:#ffffff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.16);transition:transform .12s}
.rvroot .rb2:hover{background:rgba(255,255,255,0.16)}
.rvroot .rb:active,.rvroot .rb2:active,.rvroot .nav:active,.rvroot .qa:active{transform:scale(.97)}
.rvroot .rb.off{opacity:.4;pointer-events:none}
.rvroot .rb.red{background:#E5543F;color:#ffffff}
.rvroot .rb.green{background:#2FB86E;color:#0B1A2E}
.rvroot .nav{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;width:100%;min-height:56px}
.rvroot .nav:hover{background:rgba(255,255,255,0.06)}
.rvroot .nav.on{background:rgba(127,211,247,0.16);box-shadow:inset 0 0 0 1px rgba(127,211,247,0.5)}
.rvroot .kbd{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.75);white-space:nowrap}
.rvroot .qa{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;background:rgba(255,255,255,0.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1);min-height:120px}
.rvroot .qa:hover{background:rgba(255,255,255,0.09)}
.rvroot .inp{box-sizing:border-box;min-height:46px;border-radius:12px;border:1px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.07);color:#ffffff;padding:0 14px;font-size:15px;outline:none;width:100%}
.rvroot .inp:focus{border-color:#7FD3F7;box-shadow:0 0 0 3px rgba(127,211,247,0.25)}
.rvroot .inp::placeholder{color:rgba(255,255,255,0.45)}
.rvroot .lbl{font-size:11px;font-weight:800;letter-spacing:.6px;color:rgba(255,255,255,0.62);text-transform:uppercase}
.rvroot .sub{font-size:14px;color:rgba(255,255,255,0.72);line-height:1.55}
.rvroot .card{background:rgba(255,255,255,0.05);border-radius:14px;padding:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.09)}
.rvroot .term{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;line-height:1.55}
.rvroot .chip{all:unset;box-sizing:border-box;cursor:pointer;height:32px;padding:0 12px;border-radius:16px;font-size:12px;font-weight:700;background:rgba(255,255,255,0.08);color:#ffffff;display:inline-flex;align-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.12)}
.rvroot .chip:hover{background:rgba(255,255,255,0.14)}
.rvroot .scr{overflow:auto}
.rvroot .scr::-webkit-scrollbar{width:8px}
.rvroot .scr::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px}
.rvroot .fadein{animation:fadein .35s ease-out both}@keyframes fadein{from{opacity:0}to{opacity:1}}
.rvroot .slide{animation:slide .28s cubic-bezier(.2,.9,.3,1.1) both}@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rvroot .bootbar{animation:boot 1.5s cubic-bezier(.6,0,.3,1) both}@keyframes boot{from{width:0}to{width:100%}}
.rvroot .blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.rvroot .toast{animation:toast .3s cubic-bezier(.2,.9,.3,1.2) both}@keyframes toast{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}

</style>
</head>
<body>
<div id="safe"></div>
<div id="stage"></div>
<template id="pxtpl"><div data-pxroot="1" class="{{rootCls}}" style="{{rootStyle}}" tabIndex="0" ref="{{rootRef}}" onKeyDown="{{onKeyRoot}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerDown="{{onRootDown}}">

  <!-- Wallpaper -->
  <div aria-hidden="true" class="blob1" style="position: absolute; width: 760px; height: 760px; left: -200px; top: -240px; border-radius: 50%; background: {{wp.b1}}; filter: blur(110px); opacity: 0.85"></div>
  <div aria-hidden="true" class="blob2" style="position: absolute; width: 620px; height: 620px; right: -200px; top: 120px; border-radius: 50%; background: {{wp.b2}}; filter: blur(120px); opacity: 0.6"></div>
  <div aria-hidden="true" class="blob3" style="position: absolute; width: 700px; height: 520px; left: 220px; bottom: -260px; border-radius: 50%; background: {{wp.b3}}; filter: blur(130px); opacity: 0.6"></div>
  <svg aria-hidden="true" viewBox="0 0 1180 820" width="100%" height="100%" preserveAspectRatio="none" style="position: absolute; inset: 0; opacity: 0.18">
    <path d="M0 600 L150 470 L260 540 L420 380 L560 520 L700 430 L860 540 L1000 450 L1180 560 L1180 820 L0 820 Z" fill="{{wp.m1}}"></path>
    <path d="M0 680 L200 590 L360 650 L540 570 L720 640 L900 580 L1180 650 L1180 820 L0 820 Z" fill="{{wp.m2}}"></path>
  </svg>

  <!-- Desktop layer -->
  <div style="position: absolute; inset: 28px 0 0 0; z-index: 1" onContextMenu="{{onDeskMenu}}">
    <div style="position: absolute; left: 20px; top: 18px; display: {{deskWDisp}}; flex-direction: column; gap: 14px; width: 190px">
      <sc-for list="{{wdg}}" as="g" hint-placeholder-count="3">
      <sc-if value="{{g.is.cal}}" hint-placeholder-val="{{ true }}">
      <button class="plain glass" onClick="{{open.calendar}}" style="border-radius: 22px; padding: 14px 16px; color: #ffffff; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 800; color: #FF8A80; letter-spacing: .5px">{{desk.dayName}}</span>
        <span style="font-size: 46px; font-weight: 800; line-height: 1">{{desk.dayNum}}</span>
        <span style="font-size: 12px; font-weight: 600; opacity: .85">{{desk.eventLine}}</span>
      </button>
      </sc-if>
      <sc-if value="{{g.is.wx}}" hint-placeholder-val="{{ false }}">
      <button class="plain glass" onClick="{{open.weather}}" style="border-radius: 22px; padding: 14px 16px; color: #ffffff; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 800; opacity: .9">{{wx.city}}</span>
        <span style="font-size: 40px; font-weight: 800; line-height: 1">{{wx.temp}}</span>
        <span style="font-size: 12px; font-weight: 600; opacity: .85">{{wx.cond}} · H {{wx.hi}} L {{wx.lo}}</span>
      </button>
      </sc-if>
      <sc-if value="{{g.is.music}}" hint-placeholder-val="{{ false }}">
      <div class="glass" style="border-radius: 22px; padding: 12px 14px; color: #ffffff; display: flex; align-items: center; gap: 10px">
        <span style="width: 40px; height: 40px; border-radius: 10px; background: {{mus.g}}; flex: none"></span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{mus.name}}</span>
          <span style="display: block; font-size: 11px; font-weight: 600; opacity: .8">{{mus.state}}</span>
        </span>
        <button class="plain" onClick="{{mus.toggle}}" aria-label="{{mus.aria}}" style="width: 34px; height: 34px; border-radius: 17px; background: #ffffff; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="#0B1A2E"><path d="{{mus.icon}}"></path></svg>
        </button>
      </div>
      </sc-if>
      <sc-if value="{{g.is.clock}}" hint-placeholder-val="{{ false }}">
        <button class="plain glass" onClick="{{open.clock}}" style="border-radius: 22px; padding: 14px 16px; color: #ffffff; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 800; opacity: .9">{{wclk.label}}</span>
          <span style="font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -1px">{{wclk.time}}</span>
          <span style="font-size: 12px; font-weight: 600; opacity: .85">{{wclk.sub}}</span>
        </button>
      </sc-if>
      <sc-if value="{{g.is.todo}}" hint-placeholder-val="{{ false }}">
        <button class="plain glass" onClick="{{open.todo}}" style="border-radius: 22px; padding: 14px 16px; color: #ffffff; display: flex; flex-direction: column; gap: 4px; text-align: left">
          <span style="font-size: 12px; font-weight: 800; color: #9AE6C8">{{wtd.label}}</span>
          <span style="font-size: 26px; font-weight: 800; line-height: 1">{{wtd.left}}</span>
          <span style="font-size: 12px; font-weight: 600; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 158px">{{wtd.first}}</span>
        </button>
      </sc-if>
      <sc-if value="{{g.is.note}}" hint-placeholder-val="{{ false }}">
        <button class="plain glass" onClick="{{open.notes}}" style="border-radius: 22px; padding: 14px 16px; color: #ffffff; display: flex; flex-direction: column; gap: 4px; text-align: left">
          <span style="font-size: 12px; font-weight: 800; color: #FFD27F">{{wnt.label}}</span>
          <span style="font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 158px">{{wnt.title}}</span>
          <span style="font-size: 12px; font-weight: 600; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 158px">{{wnt.body}}</span>
        </button>
      </sc-if>
      </sc-for>
    </div>
    <div style="position: absolute; inset: 0; display: {{deskIDispB}}; pointer-events: none">
      <sc-for list="{{deskIcons}}" as="d" hint-placeholder-count="5">
        <button class="plain dicon {{d.cls}}" onPointerDown="{{d.down}}" onClick="{{d.open}}" aria-label="{{d.aria}}" style="{{d.style}}">
          <sc-if value="{{d.isDrive}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="56" height="48" viewBox="0 0 56 48"><rect x="2" y="8" width="52" height="34" rx="6" fill="#DCE3EC"></rect><rect x="2" y="30" width="52" height="12" rx="4" fill="#B9C3D0"></rect><circle cx="44" cy="36" r="2.4" fill="#2FB86E"></circle></svg></sc-if>
          <sc-if value="{{d.isFolder}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="58" height="48" viewBox="0 0 58 48"><path d="M3 8a4 4 0 0 1 4-4h14l5 5h25a4 4 0 0 1 4 4v29a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z" fill="#3A8FD9"></path><path d="M3 15h52v27a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z" fill="#5BAAF0"></path></svg></sc-if>
          <sc-if value="{{d.isFile}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="40" height="50" viewBox="0 0 40 50"><path d="M4 2h22l10 10v34a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#ffffff"></path><path d="M26 2v10h10" fill="#DCE3EC"></path><path d="M9 22h20M9 28h20M9 34h13" stroke="#9AA4B2" stroke-width="2"></path></svg></sc-if>
          <span class="dicon-l">{{d.name}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <!-- WINDOWS -->
  <div class="{{spCls}}" style="position: absolute; inset: 0; z-index: 5; pointer-events: none">
    <sc-if value="{{snapOn}}" hint-placeholder-val="{{ false }}">
      <div aria-hidden="true" class="fadein" style="{{snapStyle}}"></div>
    </sc-if>
    <sc-for list="{{windows}}" as="w" hint-placeholder-count="0">
      <div class="win {{w.tcls}}" style="{{w.style}}" onPointerDown="{{w.focus}}">
        <div class="tbar" onPointerDown="{{w.drag}}" onDoubleClick="{{w.max}}">
          <div style="display: flex; gap: 0" onPointerDown="{{stopProp}}">
            <button class="tl" aria-label="Close {{w.name}}" onClick="{{w.close}}"><span style="background: #F0605A"></span></button>
            <button class="tl" aria-label="Minimize {{w.name}}" onClick="{{w.min}}"><span style="background: #F4BE4F"></span></button>
            <button class="tl" aria-label="Maximize {{w.name}}" onClick="{{w.max}}"><span style="background: #5ACB6A"></span></button>
          </div>
          <span class="ico" style="width: 20px; height: 20px; border-radius: 6px; background: {{w.c}}; box-shadow: none"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{w.d}}"></path></svg></span>
          <span style="font-weight: 800; font-size: 13px">{{w.name}}</span>
        </div>
        <div class="wbody">

          <!-- 1 PX OFFICIAL -->
          <sc-if value="{{w.is.official}}" hint-placeholder-val="{{ false }}">
            <div class="scr" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px; text-align: center">
              <span class="ico floaty" style="width: 92px; height: 92px; border-radius: 26px; background: #2F8FD8"><svg aria-hidden="true" width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{peng}}"></path></svg></span>
              <div style="font-size: 26px; font-weight: 800">PenguixOS</div>
              <div class="w-sub">{{off.line}}</div>
              <sc-if value="{{off.idle}}" hint-placeholder-val="{{ true }}">
                <button class="w-btn" onClick="{{off.install}}">Install Quetzalcoatlus</button>
              </sc-if>
              <sc-if value="{{off.run}}" hint-placeholder-val="{{ false }}">
                <div style="width: 260px; display: flex; flex-direction: column; gap: 6px">
                  <div style="height: 8px; border-radius: 4px; background: var(--line); overflow: hidden"><div style="height: 100%; width: {{off.pct}}; background: var(--acc); transition: width .15s"></div></div>
                  <div class="w-sub">Installing… {{off.pct}}</div>
                </div>
              </sc-if>
              <sc-if value="{{off.ready}}" hint-placeholder-val="{{ false }}">
                <div class="w-sub">Quetzalcoatlus is downloaded.</div>
                <button class="w-btn" onClick="{{off.restart}}">Restart to install</button>
              </sc-if>
              <sc-if value="{{off.done}}" hint-placeholder-val="{{ false }}">
                <div style="font-weight: 800; color: var(--acc)">✓ PenguixOS is up to date</div>
              </sc-if>
              <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: center">
                <sc-for list="{{off.versions}}" as="v" hint-placeholder-count="4"><span class="w-chip {{v.cls}}">{{v.name}}</span></sc-for>
              </div>
              <div class="w-card" style="width: 100%; box-sizing: border-box; text-align: left; line-height: 1.7">
                <div><b>Device</b> · PxBook</div>
                <div><b>Ecosystem</b> · PxPC, PxPhone, PxPhone Fold Quad, PxBook</div>
                <div><b>Plan</b> · {{planName}}</div>
                <div><b>Languages</b> · English, Tibetan, Uyghur, Mongolian</div>
              </div>
            </div>
          </sc-if>

          <!-- 2 PX NEWS -->
          <sc-if value="{{w.is.news}}" hint-placeholder-val="{{ false }}">
            <div class="w-side scr" style="width: 250px">
              <sc-for list="{{news.list}}" as="n" hint-placeholder-count="4">
                <button class="w-item {{n.cls}}" onClick="{{n.pick}}" style="flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px">
                  <span style="font-size: 10px; font-weight: 800; letter-spacing: .5px; opacity: .75">{{n.tag}}</span>
                  <span style="font-weight: 700; line-height: 1.35">{{n.title}}</span>
                </button>
              </sc-for>
            </div>
            <div class="scr" style="flex: 1; padding: 26px; display: flex; flex-direction: column; gap: 10px">
              <div style="font-size: 11px; font-weight: 800; letter-spacing: .6px; color: #E5543F">{{news.cur.tag}}</div>
              <div style="font-size: 24px; font-weight: 800; line-height: 1.25">{{news.cur.title}}</div>
              <div class="w-sub">{{news.cur.time}}</div>
              <div style="font-size: 15px; line-height: 1.65">{{news.cur.body}}</div>
            </div>
          </sc-if>

          <!-- 3 PX NEW ZEALAND -->
          <sc-if value="{{w.is.nz}}" hint-placeholder-val="{{ false }}">
            <div class="scr" style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px">
              <div style="display: flex; gap: 6px; flex-wrap: wrap">
                <sc-for list="{{nz.cities}}" as="c" hint-placeholder-count="4"><button class="w-chip {{c.cls}}" onClick="{{c.pick}}">{{c.name}}</button></sc-for>
              </div>
              <div style="height: 160px; border-radius: 16px; background: linear-gradient(160deg,#7FD3C8,#1E8A5A); position: relative; overflow: hidden; flex: none">
                <svg aria-hidden="true" viewBox="0 0 500 160" width="100%" height="160" preserveAspectRatio="none" style="position: absolute; inset: 0"><path d="M0 130 L80 70 L140 100 L230 40 L320 95 L400 60 L500 105 L500 160 L0 160Z" fill="rgba(255,255,255,0.35)"></path><path d="M0 145 L110 110 L210 135 L300 105 L420 130 L500 120 L500 160 L0 160Z" fill="rgba(11,26,46,0.25)"></path></svg>
                <div style="position: absolute; left: 18px; bottom: 14px; color: #ffffff"><div style="font-size: 28px; font-weight: 800">{{nz.cur.name}}</div><div style="font-size: 13px; font-weight: 700">{{nz.cur.tag}}</div></div>
              </div>
              <sc-for list="{{nz.cur.items}}" as="it" hint-placeholder-count="3">
                <div class="w-card" style="padding: 10px 12px; font-size: 14px">{{it}}</div>
              </sc-for>
              <div style="display: flex; align-items: center; gap: 10px">
                <button class="w-btn" onClick="{{nz.save}}">{{nz.saveLabel}}</button>
                <span class="w-sub">Saved: {{nz.saved}}</span>
              </div>
            </div>
          </sc-if>

          <!-- 4 PX GAMES -->
          <sc-if value="{{w.is.games}}" hint-placeholder-val="{{ false }}">
            <div class="scr" style="zoom: {{w.k}}; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px">
              <div class="w-h">Tic-Tac-Toe vs PxBot</div>
              <div class="w-sub">You {{ttt.you}} · PxBot {{ttt.bot}} · Draws {{ttt.draw}}</div>
              <div style="display: grid; grid-template-columns: repeat(3, 96px); gap: 8px">
                <sc-for list="{{ttt.cells}}" as="c" hint-placeholder-count="9">
                  <button class="ttt" onClick="{{c.play}}" aria-label="{{c.aria}}" style="color: {{c.color}}">{{c.v}}</button>
                </sc-for>
              </div>
              <div style="font-weight: 800; font-size: 15px">{{ttt.msg}}</div>
              <button class="w-btn" onClick="{{ttt.reset}}">New game</button>
            </div>
          </sc-if>

          <!-- 6 PXCHAT -->
          <sc-if value="{{w.is.chat}}" hint-placeholder-val="{{ false }}">
            <div style="flex: 1; display: flex; flex-direction: column">
              <div class="scr" style="flex: 1; display: flex; flex-direction: column-reverse; padding: 14px">
                <div style="display: flex; flex-direction: column; gap: 8px">
                  <sc-for list="{{chat.msgs}}" as="m" hint-placeholder-count="2">
                    <div style="{{m.style}}">{{m.text}}</div>
                  </sc-for>
                  <sc-if value="{{chat.typing}}" hint-placeholder-val="{{ false }}">
                    <div style="align-self: flex-start; background: var(--card); padding: 10px 14px; border-radius: 16px; display: flex; gap: 3px; align-items: center; height: 14px"><span class="eq"></span><span class="eq"></span><span class="eq"></span></div>
                  </sc-if>
                </div>
              </div>
              <div style="display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line)">
                <input class="w-inp" style="flex: 1" aria-label="Message" placeholder="Message Penguix Bot" value="{{chat.draft}}" onChange="{{chat.onDraft}}" onKeyDown="{{chat.onKey}}">
                <button class="w-btn" onClick="{{chat.send}}">Send</button>
              </div>
            </div>
          </sc-if>

              </div>

        <div class="rz rz-ne" onPointerDown="{{w.rz.ne}}" aria-hidden="true"></div>

      <button class="mb" onClick="{{stopRecBtn}}" aria-label="Stop screen recording" title="Stop recording (⇧⌘V)" style="font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px"><span class="recdot" style="width: 9px; height: 9px; border-radius: 5px; background: #FF4D4D"></span>{{recTime}}</button>

    </button>
    <button class="mb {{sbCls.battery}}" onClick="{{sbOpen.battery}}" aria-label="{{batv.aria}}" aria-haspopup="true" style="gap: 5px; font-size: 12px; font-weight: 700">

    </button>
    <button class="mb {{sbCls.wifi}}" onClick="{{sbOpen.wifi}}" aria-label="{{wifiAria}}" aria-haspopup="true"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="{{wifiOp}}"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0M12 19.5h.01"></path></svg></button>
    <sc-if value="{{sbBtOn}}" hint-placeholder-val="{{ true }}"><button class="mb {{sbCls.bt}}" onClick="{{sbOpen.bt}}" aria-label="Bluetooth" aria-haspopup="true"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="{{btOp}}"><path d="M7 7l10 10-5 4V3l5 4L7 17"></path></svg></button></sc-if>

          <div class="su-row" style="margin-top: 6px"><sc-for list="{{su.clocks}}" as="c" hint-placeholder-count="2"><button class="su-chip {{c.cls}}" onClick="{{c.pick}}" aria-pressed="{{c.on}}">{{c.name}}</button></sc-for></div>
          <div class="su-row"><sc-for list="{{su.units}}" as="u" hint-placeholder-count="2"><button class="su-chip {{u.cls}}" onClick="{{u.pick}}" aria-pressed="{{u.on}}">{{u.name}}</button></sc-for></div>
          <div class="su-sub" style="font-size: 14px; margin-top: 4px">Preview: <b>{{su.preview}}</b></div>
        </sc-if>

        <!-- NEW STEP: WI-FI -->
        <sc-if value="{{su.k.wifi}}" hint-placeholder-val="{{ false }}">
          <div class="su-title" style="margin-top: 4px">Connect to Wi‑Fi</div>
          <div class="su-sub">Pick a network for your PxBook.</div>
          <div style="display: flex; flex-direction: column; gap: 6px; width: 440px">
            <sc-for list="{{su.nets}}" as="n" hint-placeholder-count="4">
              <button class="su-opt {{n.cls}}" onClick="{{n.pick}}" aria-pressed="{{n.on}}" style="width: 100%; height: 50px">
                <span style="display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="{{n.bars}}"></path></svg>{{n.name}}</span>
                <span style="font-size: 13px; opacity: .85">{{n.tag}}</span>
              </button>
            </sc-for>
          </div>
          <sc-if value="{{su.needPass}}" hint-placeholder-val="{{ false }}">
            <input class="su-inp" type="password" aria-label="Wi-Fi password" placeholder="Wi-Fi password (8+ characters)" value="{{su.wifiPass}}" onChange="{{su.onWifiPass}}" onKeyDown="{{su.onKey}}" style="width: 440px; height: 42px">
          </sc-if>
        </sc-if>

        <!-- NEW STEP: DISPLAY -->
        <sc-if value="{{su.k.display}}" hint-placeholder-val="{{ false }}">
          <div class="su-title" style="margin-top: 4px">Display resolution</div>
          <div class="su-sub">{{su.resNow}}</div>
          <div class="su-row" style="max-width: 540px"><sc-for list="{{su.ress}}" as="r" hint-placeholder-count="5"><button class="su-chip {{r.cls}}" onClick="{{r.pick}}" aria-pressed="{{r.on}}">{{r.name}}</button></sc-for></div>
          <div class="su-sub" style="font-size: 14px; max-width: 460px">{{su.resDesc}}</div>
        </sc-if>

        <!-- NEW STEP: ACCESSIBILITY -->
        <sc-if value="{{su.k.access}}" hint-placeholder-val="{{ false }}">
          <div class="su-title" style="margin-top: 4px">Accessibility</div>
          <div class="su-sub">Make PxBook easier to see and use.</div>
          <div style="display: flex; flex-direction: column; gap: 8px; width: 460px">
            <sc-for list="{{su.access}}" as="t" hint-placeholder-count="3"><div class="su-tog"><span style="flex: 1"><span style="display: block; font-weight: 800">{{t.label}}</span><span style="display: block; font-size: 12px; opacity: .8">{{t.hint}}</span></span><button class="sw {{t.cls}}" role="switch" aria-checked="{{t.aria}}" aria-label="{{t.label}}" onClick="{{t.flip}}"></button></div></sc-for>
          </div>
        </sc-if>

        <!-- NEW STEP: WALLPAPER -->
        <sc-if value="{{su.k.wall}}" hint-placeholder-val="{{ false }}">
          <div class="su-title" style="margin-top: 4px">Choose a wallpaper</div>
          <div class="su-sub">You can change it later in Control Center.</div>
          <div style="display: grid; grid-template-columns: repeat(2, 200px); gap: 14px; margin-top: 4px">
            <sc-for list="{{su.walls}}" as="w" hint-placeholder-count="4"><button class="plain" onClick="{{w.pick}}" aria-pressed="{{w.on}}" style="display: flex; flex-direction: column; gap: 6px; align-items: center"><span style="{{w.style}}"></span><span style="font-weight: 800; font-size: 14px">{{w.name}}</span></button></sc-for>
          </div>
        </sc-if>

        <!-- NEW STEP: DOCK AND POINTER -->
        <sc-if value="{{su.k.dock}}" hint-placeholder-val="{{ false }}">
          <div class="su-title" style="margin-top: 4px">Dock and pointer</div>
          <div class="su-sub">How your Dock and mouse pointer behave.</div>
          <div style="display: flex; flex-direction: column; gap: 8px; width: 460px">
            <sc-for list="{{su.dockToggles}}" as="t" hint-placeholder-count="3"><div class="su-tog"><span style="flex: 1"><span style="display: block; font-weight: 800">{{t.label}}</span><span style="display: block; font-size: 12px; opacity: .8">{{t.hint}}</span></span><button class="sw {{t.cls}}" role="switch" aria-checked="{{t.aria}}" aria-label="{{t.label}}" onClick="{{t.flip}}"></button></div></sc-for>
          </div>
        </sc-if>

        <!-- NEW STEP: FAVORITE APPS -->
        <sc-if value="{{su.k.apps}}" hint-placeholder-val="{{ false }}">
          <div class="su-title" style="margin-top: 4px">Pick your Dock apps</div>
          <div class="su-sub">{{su.appsCount}} · Px Apps and Trash are always there.</div>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 560px">
            <sc-for list="{{su.apps}}" as="a" hint-placeholder-count="20"><button class="su-chip {{a.cls}}" onClick="{{a.toggle}}" aria-pressed="{{a.on}}" style="padding: 0 10px; min-height: 40px; font-size: 13px"><span style="width: 20px; height: 20px; border-radius: 6px; background: {{a.c}}; flex: none; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.d}}"></path></svg></span>{{a.name}}</button></sc-for>
          </div>
        </sc-if>

        <!-- NEW STEP: NOTIFICATIONS AND SOUND -->
        <sc-if value="{{su.k.notif}}" hint-placeholder-val="{{ false }}">
          <div class="su-title" style="margin-top: 4px">Notifications and sound</div>
          <div class="su-sub">Choose what PxBook tells you, and how loud it is.</div>
          <div style="display: flex; flex-direction: column; gap: 8px; width: 460px">
            <sc-for list="{{su.notifToggles}}" as="t" hint-placeholder-count="1"><div class="su-tog"><span style="flex: 1"><span style="display: block; font-weight: 800">{{t.label}}</span><span style="display: block; font-size: 12px; opacity: .8">{{t.hint}}</span></span><button class="sw {{t.cls}}" role="switch" aria-checked="{{t.aria}}" aria-label="{{t.label}}" onClick="{{t.flip}}"></button></div></sc-for>
            <div class="su-tog" style="flex-direction: column; align-items: stretch; gap: 8px">
              <label style="display: flex; align-items: center; gap: 10px; font-weight: 800">Volume <input type="range" min="0" max="100" value="{{su.volume}}" onChange="{{su.onVolume}}" style="flex: 1; accent-color: var(--acc)"> {{su.volume}}%</label>
              <button class="su-chip" onClick="{{su.testSound}}" style="align-self: flex-start">Play test sound</button>
            </div>
          </div>
        </sc-if>

        <!-- NEW STEP: HOME CITY AND PRIVACY -->
        <sc-if value="{{su.k.city}}" hint-placeholder-val="{{ false }}">
          <div class="su-title" style="margin-top: 4px">Home city and privacy</div>
          <div class="su-sub">Your home city shows on the weather widget and in PxWeather.</div>
          <div class="su-row"><sc-for list="{{su.cities}}" as="c" hint-placeholder-count="4"><button class="su-chip {{c.cls}}" onClick="{{c.pick}}" aria-pressed="{{c.on}}">{{c.name}}</button></sc-for></div>
          <div style="display: flex; flex-direction: column; gap: 8px; width: 460px; margin-top: 6px">
            <sc-for list="{{su.privacy}}" as="t" hint-placeholder-count="1"><div class="su-tog"><span style="flex: 1"><span style="display: block; font-weight: 800">{{t.label}}</span><span style="display: block; font-size: 12px; opacity: .8">{{t.hint}}</span></span><button class="sw {{t.cls}}" role="switch" aria-checked="{{t.aria}}" aria-label="{{t.label}}" onClick="{{t.flip}}"></button></div></sc-for>
          </div>
        </sc-if>

        <!-- NEW STEP: PLAN -->
        <sc-if value="{{su.k.plan}}" hint-placeholder-val="{{ false }}">

          </div>
        </sc-if>

        <sc-if value="{{su.s5}}" hint-placeholder-val="{{ false }}">
          <span class="floaty" style="width: 110px; height: 110px; border-radius: 55px; background: var(--acc); color: #0B1A2E; font-size: 44px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-top: 16px; box-shadow: 0 14px 34px rgba(0,0,0,0.35)">{{su.initials}}</span>

            <div>Language · <b>{{su.sumLang}}</b></div>
            <div>Look · <b>{{su.sumLook}}</b> · {{su.sumWall}}</div>
            <div>Region · <b>{{su.sumRegion}}</b></div>
            <div>Wi‑Fi · <b>{{su.sumWifi}}</b></div>
            <div>Dock · <b>{{su.sumDock}}</b> · Plan · <b>{{su.sumPlan}}</b></div>
            <div>Password · <b>✓ Set</b></div>
          </div>
        </sc-if>

        <div style="flex: 1"></div>
        <div role="alert" style="min-height: 18px; font-size: 13px; font-weight: 700; color: #FFB4AE">{{su.err}}</div>
        <div style="display: flex; gap: 10px; align-items: center">
          <sc-if value="{{su.showBack}}" hint-placeholder-val="{{ false }}">
            <button class="su-back" onClick="{{su.back}}">Back</button>
          </sc-if>
          <button class="su-btn" onClick="{{su.next}}">{{su.nextLabel}}</button>
          <sc-if value="{{su.canSkip}}" hint-placeholder-val="{{ false }}">
            <button class="su-back" onClick="{{su.skip}}">Set up later</button>
          </sc-if>
        </div>
        <div style="display: flex; gap: 10px; align-items: center; margin-top: 2px">
          <div aria-hidden="true" style="display: flex; gap: 4px"><sc-for list="{{su.dots}}" as="d" hint-placeholder-count="16"><span style="{{d.style}}"></span></sc-for></div>
          <span style="font-size: 12px; font-weight: 700; opacity: .7">Step {{su.stepNum}} of {{su.stepTotal}}</span>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- BOOT -->
  <sc-if value="{{booting}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 1600; background: {{boot.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #ffffff">
      <div class="bootlogo" style="position: relative; width: 130px; height: 130px; display: flex; align-items: center; justify-content: center">
        <span aria-hidden="true" class="bootglow" style="position: absolute; inset: -30px; border-radius: 50%; background: radial-gradient(circle, {{boot.glow}} 0%, rgba(0,0,0,0) 65%)"></span>
        <svg aria-hidden="true" width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" style="position: relative"><path d="{{peng}}"></path></svg>
      </div>

      <div class="bootword" style="font-size: 13px; font-weight: 700; letter-spacing: 2px; opacity: .65; margin-top: -12px">{{boot.ver}}</div>
      <div style="width: 220px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.18); overflow: hidden; margin-top: 10px"><div class="{{boot.barCls}}" style="height: 100%; background: {{boot.barBg}}"></div></div>
      <div style="min-height: 18px; font-size: 13px; font-weight: 600; opacity: .8">{{boot.msg}}</div>
      <a href="#recovery" ref="{{recRef}}" style="position: absolute; bottom: 44px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.6); text-decoration: none; padding: 8px 14px">Hold ⌘R or tap here to start Recovery</a>
    </div>
  </sc-if>

  <sc-if value="{{nightOn}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 1895; pointer-events: none; background: rgba(255,150,50,0.22); mix-blend-mode: multiply"></div>
  </sc-if>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: 1900; pointer-events: none; background: #000000; opacity: {{dim}}"></div>

  </sc-if>
  <sc-if value="{{offOn}}" hint-placeholder-val="{{ false }}">
    <div class="fadein" style="position: absolute; inset: 0; z-index: 1995; background: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: rgba(255,255,255,0.6)">
      <button class="plain" onClick="{{powerOn}}" aria-label="Turn PxBook on" style="width: 84px; height: 84px; border-radius: 42px; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9M6.3 6.8a8 8 0 1 0 11.4 0"></path></svg>
      </button>
      <div style="font-size: 14px; font-weight: 700">PxBook is turned off</div>
      <div style="font-size: 12px">Press the power button to turn it on</div>
    </div>

    <div class="dglass fadein" role="status" style="position: absolute; left: 50%; top: 40px; transform: translateX(-50%); z-index: 1970; border-radius: 16px; padding: 8px 10px 8px 16px; display: flex; gap: 12px; align-items: center; color: #ffffff; white-space: nowrap">

      <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px">{{rp.time}}</span>
      <div style="width: 140px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden"><div style="height: 100%; width: {{rp.pct}}; background: var(--acc)"></div></div>
      <button class="su-chip" onClick="{{rp.stop}}" style="min-height: 30px; padding: 0 14px">Stop</button>
    </div>
  </sc-if>

  <!-- PX CURSOR -->
  <sc-if value="{{cursorOn}}" hint-placeholder-val="{{ false }}">
    <svg aria-hidden="true" width="26" height="30" viewBox="0 0 26 30" style="{{cursorStyle}}"><path d="M3 2 L3 22 L8.5 16.8 L12.2 25.5 L15.6 24 L12 15.6 L19.5 15.6 Z" fill="#ffffff" stroke="#0B1A2E" stroke-width="1.6" stroke-linejoin="round"></path><circle cx="19" cy="24" r="3.2" fill="{{accent}}" stroke="#0B1A2E" stroke-width="1.2"></circle></svg>

</div></template>
<template id="rvtpl"><div data-rvroot="1" tabIndex="0" onKeyDown="{{onKey}}" onPointerDown="{{onRootDown}}" ref="{{rootRef}}" style="{{rootStyle}}">

  <!-- RECOVERY BOOT (tap or any key skips) -->
  <sc-if value="{{booting}}" hint-placeholder-val="{{ false }}">
    <button class="plain" onClick="{{skipBoot}}" aria-label="Skip startup" style="position: absolute; inset: 0; z-index: 10; background: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; cursor: default">
      <svg class="fadein" aria-hidden="true" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="{{peng}}"></path></svg>
      <span class="fadein" style="font-size: 14px; font-weight: 700; letter-spacing: 3px; color: rgba(255,255,255,0.75)">STARTING RECOVERY</span>
      <span style="display: block; width: 220px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.18); overflow: hidden"><span class="bootbar" style="display: block; height: 100%; background: #ffffff"></span></span>
      <span style="font-size: 12px; color: rgba(255,255,255,0.45)">Tap or press any key to skip</span>
    </button>
  </sc-if>

  <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 25% 15%, #1B2A44 0%, #0B111D 55%, #05070D 100%)"></div>

    <!-- top bar -->
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 18px; background: rgba(10,14,24,0.7); border-bottom: 1px solid rgba(255,255,255,0.07)">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{peng}}"></path></svg>
      <span style="font-weight: 800; font-size: 16px">PenguixOS Recovery</span>
      <span style="flex: 1"></span>
      <span class="sub" style="font-size: 13px">{{clock}}</span>
      <a class="rb green" href="#" ref="{{restartRef}}" style="min-height: 38px; padding: 0 16px; font-size: 14px">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B1A2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9M6.4 6.4a8 8 0 1 0 11.2 0"></path></svg>
        Restart PxBook
      </a>
    </div>

    <div style="position: absolute; left: 0; right: 0; top: 52px; bottom: 0; display: flex">
      <!-- sidebar -->
      <nav aria-label="Recovery tools" class="scr" style="width: 300px; flex: none; padding: 16px 14px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid rgba(255,255,255,0.07); background: rgba(10,14,24,0.45); box-sizing: border-box">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
          <button class="nav {{n.cls}}" onClick="{{n.open}}" aria-current="{{n.cur}}">
            <span style="width: 36px; height: 36px; border-radius: 10px; background: {{n.c}}; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg></span>
            <span style="flex: 1; text-align: left; min-width: 0"><span style="display: block; font-weight: 800; font-size: 14px">{{n.name}}</span><span style="display: block; font-size: 12px; color: rgba(255,255,255,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.desc}}</span></span>
            <span class="kbd" aria-hidden="true">{{n.key}}</span>
          </button>
        </sc-for>
        <div style="flex: 1; min-height: 12px"></div>
        <sc-if value="{{undo.has}}" hint-placeholder-val="{{ false }}">
          <div class="card" style="padding: 12px; display: flex; flex-direction: column; gap: 8px">
            <div class="lbl">Undo available</div>
            <div style="font-size: 13px; font-weight: 700">{{undo.label}}</div>
            <div style="font-size: 12px; color: rgba(255,255,255,0.6)">{{undo.when}}</div>
            <button class="rb2" onClick="{{undo.run}}" style="min-height: 38px; font-size: 14px">↶ Undo this change</button>
          </div>
        </sc-if>
        <div style="font-size: 11px; color: rgba(255,255,255,0.45); line-height: 1.5; padding: 6px 4px">Keys: <span class="kbd">1</span>–<span class="kbd">7</span> open a tool · <span class="kbd">↑</span><span class="kbd">↓</span> move · <span class="kbd">esc</span> overview · <span class="kbd">⌘R</span> restart</div>
      </nav>

      <!-- content -->
      <main class="scr" style="flex: 1; min-width: 0; padding: 28px 36px 120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
        <div class="slide" style="display: flex; align-items: center; gap: 14px">
          <span style="width: 48px; height: 48px; border-radius: 13px; background: {{cur.c}}; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{cur.d}}"></path></svg></span>
          <div style="min-width: 0"><h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.3px">{{cur.name}}</h1><div class="sub">{{cur.long}}</div></div>
        </div>

        <!-- OVERVIEW -->
        <sc-if value="{{is.home}}" hint-placeholder-val="{{ true }}">
          <div class="card slide" style="display: flex; gap: 16px; align-items: center; box-shadow: inset 0 0 0 1px {{health.ring}}">
            <span style="width: 54px; height: 54px; border-radius: 27px; background: {{health.bg}}; display: flex; align-items: center; justify-content: center; flex: none; font-size: 26px; font-weight: 800; color: #0B1A2E">{{health.mark}}</span>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 18px; font-weight: 800">{{health.title}}</div>
              <div class="sub">{{health.text}}</div>
            </div>
            <button class="rb" onClick="{{health.act}}">{{health.btn}}</button>
          </div>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
            <sc-for list="{{disk.stats}}" as="x" hint-placeholder-count="4"><div class="card" style="padding: 12px 14px"><div class="lbl">{{x.k}}</div><div style="font-size: 22px; font-weight: 800">{{x.v}}</div></div></sc-for>
          </div>
          <div class="lbl" style="margin-top: 6px">What do you want to do?</div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
            <sc-for list="{{quick}}" as="q" hint-placeholder-count="6">
              <button class="qa" onClick="{{q.open}}">
                <span style="width: 40px; height: 40px; border-radius: 11px; background: {{q.c}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{q.d}}"></path></svg></span>
                <span style="font-weight: 800; font-size: 15px">{{q.ask}}</span>
                <span style="font-size: 13px; color: rgba(255,255,255,0.65); line-height: 1.45">{{q.answer}}</span>
              </button>
            </sc-for>
          </div>
        </sc-if>

        <!-- FIRST AID -->
        <sc-if value="{{is.disk}}" hint-placeholder-val="{{ false }}">
          <div class="card" style="display: flex; gap: 16px; align-items: center">
            <svg aria-hidden="true" width="64" height="54" viewBox="0 0 56 48"><rect x="2" y="8" width="52" height="34" rx="6" fill="#DCE3EC"></rect><rect x="2" y="30" width="52" height="12" rx="4" fill="#B9C3D0"></rect><circle cx="44" cy="36" r="2.4" fill="{{health.led}}"></circle></svg>
            <div style="flex: 1"><div style="font-size: 18px; font-weight: 800">PxBook HD</div><div class="sub">{{disk.used}} used of about 5 MB browser space · {{health.short}}</div>
              <div style="height: 10px; border-radius: 5px; background: rgba(255,255,255,0.1); overflow: hidden; margin-top: 8px"><div style="height: 100%; width: {{disk.pct}}; min-width: 4px; background: #7FD3F7"></div></div></div>
          </div>
          <div class="card term scr" style="height: 300px; display: flex; flex-direction: column-reverse; flex: none">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <sc-for list="{{fa.lines}}" as="l" hint-placeholder-count="0"><div class="fadein" style="white-space: pre-wrap; color: {{l.c}}">{{l.t}}</div></sc-for>
              <sc-if value="{{fa.idle}}" hint-placeholder-val="{{ true }}"><div style="color: rgba(255,255,255,0.6)">First Aid checks your saved PxBook data and repairs anything damaged. It is safe to run any time, and you can undo its repairs.</div></sc-if>
              <sc-if value="{{fa.running}}" hint-placeholder-val="{{ false }}"><div style="color: rgba(255,255,255,0.7)">Working<span class="blink">…</span></div></sc-if>
            </div>
          </div>
        </sc-if>

        <!-- REINSTALL -->
        <sc-if value="{{is.reinstall}}" hint-placeholder-val="{{ false }}">
          <div class="card" style="display: flex; align-items: center; gap: 14px">
            <span style="width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(150deg, #1F6FB8, #2BB5B0); display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{peng}}"></path></svg></span>
            <div style="flex: 1"><div style="font-weight: 800; font-size: 16px">PenguixOS Quetzalcoatlus</div><div class="sub">Installs on PxBook HD · {{disk.used}} used · keeps your account, files and settings</div></div>
          </div>
          <div class="card" style="display: flex; flex-direction: column; gap: 6px">
            <div class="lbl">What happens</div>
            <div class="sub">✓ Your account, password, notes, files, photos and settings stay.<br>✓ PenguixOS is updated to Quetzalcoatlus.<br>✓ Open windows are closed, which fixes a stuck or messy desktop.</div>
          </div>
          <sc-if value="{{ri.running}}" hint-placeholder-val="{{ false }}">
            <div class="card" style="display: flex; flex-direction: column; gap: 8px">
              <div style="height: 10px; border-radius: 5px; background: rgba(255,255,255,0.12); overflow: hidden"><div style="height: 100%; width: {{ri.pct}}; background: #7FD3F7; transition: width .15s"></div></div>
              <div style="display: flex; justify-content: space-between" class="sub"><span>{{ri.step}}</span><span>{{ri.pct}}</span></div>
            </div>
          </sc-if>
        </sc-if>

        <!-- RESET PASSWORD -->
        <sc-if value="{{is.password}}" hint-placeholder-val="{{ false }}">
          <sc-if value="{{rp.hasAcc}}" hint-placeholder-val="{{ true }}">
            <div class="card" style="display: flex; align-items: center; gap: 12px">
              <span style="width: 48px; height: 48px; border-radius: 24px; background: #7FD3F7; color: #0B1A2E; font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center; flex: none">{{rp.initials}}</span>
              <div><div style="font-weight: 800; font-size: 16px">{{rp.name}}</div><div class="sub">Only the password changes. Everything else stays.</div></div>
            </div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 640px">
              <label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">New password</span><input class="inp" type="{{rp.type}}" value="{{rp.p1}}" onChange="{{rp.on1}}" onKeyDown="{{rp.onKey}}" autocomplete="new-password"></label>
              <label style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">Type it again</span><input class="inp" type="{{rp.type}}" value="{{rp.p2}}" onChange="{{rp.on2}}" onKeyDown="{{rp.onKey}}" autocomplete="new-password"></label>
            </div>
            <label style="display: flex; flex-direction: column; gap: 6px; max-width: 640px"><span class="lbl">Hint (optional)</span><input class="inp" type="text" value="{{rp.hint}}" onChange="{{rp.onHint}}" onKeyDown="{{rp.onKey}}"></label>
            <div style="display: flex; gap: 14px; align-items: center; font-size: 13px; font-weight: 700">
              <span style="color: {{rp.strColor}}">{{rp.strength}}</span>
              <span style="color: {{rp.matchColor}}">{{rp.match}}</span>
              <button class="plain" onClick="{{rp.toggle}}" style="text-decoration: underline; color: rgba(255,255,255,0.85); padding: 6px">{{rp.toggleLabel}}</button>
            </div>
          </sc-if>
          <sc-if value="{{rp.noAcc}}" hint-placeholder-val="{{ false }}">
            <div class="card sub">No PxBook account was found on this device, so there's no password to reset. Press <b>Restart PxBook</b> to run setup, or restore a backup code.</div>
          </sc-if>
        </sc-if>

        <!-- BACKUP & RESTORE -->
        <sc-if value="{{is.restore}}" hint-placeholder-val="{{ false }}">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
            <div class="card" style="display: flex; flex-direction: column; gap: 10px">
              <div style="font-weight: 800; font-size: 16px">Back up now</div>
              <div class="sub">Make a backup code of everything on this PxBook. Keep it somewhere safe, like PxNotes on another device or a message to yourself.</div>
              <div style="display: flex; gap: 8px; flex-wrap: wrap"><button class="rb2" onClick="{{bk.make}}">Make backup code</button><sc-if value="{{bk.has}}" hint-placeholder-val="{{ false }}"><button class="rb2" onClick="{{bk.copy}}">{{bk.copyLabel}}</button></sc-if></div>
              <sc-if value="{{bk.has}}" hint-placeholder-val="{{ false }}"><textarea class="inp" readonly aria-label="Your backup code" value="{{bk.code}}" onFocus="{{selectAll}}" style="height: 110px; padding: 10px 12px; resize: none; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px"></textarea></sc-if>
            </div>
            <div class="card" style="display: flex; flex-direction: column; gap: 10px">
              <div style="font-weight: 800; font-size: 16px">Restore from a code</div>
              <div class="sub">Paste a backup code from PxSettings › Saving or from Back up now.</div>
              <textarea class="inp" aria-label="Backup code to restore" placeholder="Paste your backup code here" value="{{rs.text}}" onChange="{{rs.onText}}" style="height: 110px; padding: 10px 12px; resize: none; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px"></textarea>
              <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><button class="rb2" onClick="{{rs.paste}}">Paste</button><span style="font-size: 13px; font-weight: 700; color: {{rs.previewColor}}">{{rs.preview}}</span></div>
            </div>
          </div>
        </sc-if>

        <!-- TERMINAL -->
        <sc-if value="{{is.terminal}}" hint-placeholder-val="{{ false }}">
          <div class="term" style="display: flex; flex-direction: column; background: #07090E; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); height: 400px; flex: none">
            <div class="scr" style="flex: 1; padding: 12px 14px; display: flex; flex-direction: column-reverse"><div><sc-for list="{{tm.lines}}" as="l" hint-placeholder-count="3"><div style="white-space: pre-wrap; color: {{l.c}}">{{l.t}}</div></sc-for></div></div>
            <label style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid rgba(255,255,255,0.08)">
              <span style="color: #FFB347; white-space: nowrap">recovery#</span>
              <input aria-label="Recovery terminal command" value="{{tm.input}}" onChange="{{tm.onInput}}" onKeyDown="{{tm.onKey}}" spellcheck="false" autocomplete="off" autocapitalize="off" style="flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font: inherit; min-height: 30px">
            </label>
          </div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center"><span class="sub" style="font-size: 12px">Tap a command:</span><sc-for list="{{tm.chips}}" as="c" hint-placeholder-count="8"><button class="chip" onClick="{{c.run}}">{{c.cmd}}</button></sc-for></div>
          <div class="sub" style="font-size: 12px"><span class="kbd">↑</span> <span class="kbd">↓</span> earlier commands · <span class="kbd">tab</span> finish a command</div>
        </sc-if>

        <!-- ERASE -->
        <sc-if value="{{is.erase}}" hint-placeholder-val="{{ false }}">
          <div class="card" style="box-shadow: inset 0 0 0 1px rgba(229,84,63,0.6); background: rgba(229,84,63,0.08); display: flex; flex-direction: column; gap: 6px">
            <div style="font-weight: 800; color: #FF9A90; font-size: 16px">This deletes everything on your PxBook</div>
            <div class="sub">Your account, password, notes, files, photos, games and settings are removed, and PxBook runs setup next time. A safety copy is kept, so you can still press <b>Undo</b> in Recovery afterwards.</div>
          </div>
          <label style="display: flex; flex-direction: column; gap: 6px; max-width: 320px"><span class="lbl">Type ERASE to confirm</span><input class="inp" value="{{er.text}}" onChange="{{er.onText}}" onKeyDown="{{er.onKey}}" autocomplete="off" autocapitalize="characters" style="font-weight: 800; letter-spacing: 2px"></label>
        </sc-if>
      </main>
    </div>

    <!-- action bar (bottom of content area) -->
    <sc-if value="{{act.show}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; left: 300px; right: 0; bottom: 0; padding: 16px 36px; display: flex; align-items: center; gap: 12px; background: linear-gradient(transparent, rgba(5,7,13,0.92) 35%)">
        <span class="sub" style="flex: 1; font-size: 13px">{{act.hint}}</span>
        <button class="rb {{act.cls}}" onClick="{{act.run}}">{{act.label}} <span class="kbd" style="background: rgba(0,0,0,0.15); color: inherit">↩</span></button>
      </div>
    </sc-if>

    <!-- toast -->
    <sc-if value="{{toast.on}}" hint-placeholder-val="{{ false }}">
      <div class="toast" role="status" style="position: absolute; left: calc(50% + 150px); bottom: 92px; transform: translateX(-50%); z-index: 6; padding: 12px 16px; border-radius: 14px; background: {{toast.bg}}; color: #0B1A2E; font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 14px 40px rgba(0,0,0,0.45); max-width: 70%">
        <span>{{toast.text}}</span>
        <sc-if value="{{toast.undo}}" hint-placeholder-val="{{ false }}"><button class="plain" onClick="{{undo.run}}" style="padding: 6px 12px; border-radius: 10px; background: rgba(0,0,0,0.15); font-weight: 800">Undo</button></sc-if>
        <sc-if value="{{toast.restart}}" hint-placeholder-val="{{ false }}"><button class="plain" onClick="{{restartNow}}" style="padding: 6px 12px; border-radius: 10px; background: rgba(0,0,0,0.15); font-weight: 800">Restart now</button></sc-if>
      </div>
    </sc-if>
  </sc-if>
</div></template>

    // PxSnake
    const sn = {

      segs: s.snake.map((p, i) => ({ style: 'position: absolute; left: ' + (p[0] * 20 + 1) + 'px; top: ' + (p[1] * 20 + 1) + 'px; width: 18px; height: 18px; border-radius: ' + (i === 0 ? 6 : 4) + 'px; background: ' + (i === 0 ? '#9AE6C8' : '#2FB86E') + ';' })),

    };
    // PxDice
    const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
    const dcv = s.dcVals.slice(0, s.dcCount);
